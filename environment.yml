name: new_proso
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.7
  - absl-py=0.9.0   # Compatible version for python 3.7
  - astor=0.8.1
  - certifi=2022.12.7
  - gast=0.3.3      # Gast version compatible with Python 3.7
  - google-pasta=0.2.0
  - grpcio=1.34.0   # Compatible grpcio for TensorFlow 1.14.0
